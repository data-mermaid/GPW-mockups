<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPW Mockup</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="top-bar">
    <span id="app-title">Global Pollution Watch</span>
    <span id="beta-badge">BETA</span>
    <div id="top-bar-actions">
      <button class="sidebar-btn" id="btn-share" data-tooltip="Share" data-tooltip-placement="bottom">
        <span class="material-icons">share</span>
      </button>
      <a href="science-and-methods/" class="top-bar-link">Science &amp; methods</a>
      <a href="#" class="top-bar-link">Contact</a>
      <button class="sidebar-btn" id="hamburger" data-tooltip="Menu" data-tooltip-placement="bottom" aria-expanded="false">
        <span class="material-icons">menu</span>
      </button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Region selector (always visible, floats above panel-bottom) -->
  <div id="bc-control">
    <button id="bc-uplevel" class="bc-btn bc-left-btn" data-tooltip="Go up one level" data-tooltip-placement="bottom">
      <span class="material-icons" style="transform:rotate(90deg)">subdirectory_arrow_left</span>
    </button>
    <div id="bc-display-wrap">
      <div id="bc-path"></div>
      <input id="bc-search" type="text" placeholder="Search countries &amp; regions…" autocomplete="off" />
    </div>
    <button id="bc-chevron" class="bc-btn bc-right-btn" data-tooltip="Select region" data-tooltip-placement="right">
      <span class="material-icons">expand_more</span>
    </button>
    <ul id="bc-dropdown" class="bc-dropdown"></ul>
  </div>

  <!-- Panels -->
  <div class="panel" id="panel-left">
    <div class="panel-content panel-content--image">
      <img src="side-bar.png" alt="Panel 1 content" />
    </div>
  </div>

  <div class="panel" id="panel-bottom">
    <div class="panel-content panel-content--image" id="panel-bottom-content">
      <img src="Wastershed-graphs.png" alt="Graphs" />
    </div>
  </div>

  <!-- Left sidebar -->
  <div id="sidebar">
    <button class="sidebar-btn" id="toggle-bottom" data-tooltip="Graphs" data-tooltip-placement="right">
      <span class="material-icons">bar_chart</span>
    </button>
    <button class="sidebar-btn" id="toggle-left" data-tooltip="Layers" data-tooltip-placement="right">
      <span class="material-icons">layers</span>
    </button>
  </div>

  <!-- Hamburger dropdown -->
  <ul id="nav-dropdown">
    <li><a href="science-and-methods/">Science and methods</a></li>
    <li><a href="#">Contact</a></li>
  </ul>

  <!-- Year bar -->
  <div id="year-bar">
    <button class="year-btn" data-year="2000">2000</button>
    <button class="year-btn" data-year="2005">2005</button>
    <button class="year-btn" data-year="2015">2015</button>
    <button class="year-btn" data-year="2020">2020</button>
    <button class="year-btn active" data-year="2025">2025</button>
  </div>

  <!-- Scale bar + coordinates -->
  <div id="map-info">
    <div id="scale-bar"><span id="scale-label"></span></div>
    <div id="coords">—</div>
  </div>

  <!-- Material Icons (Google Fonts) -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
